# Private deployment overlay for Marketdesk.
#
#   docker compose -f docker-compose.yml -f infra/compose.private.yml up -d
#
# Postgres and Redis come from the shared devs/infra stack. The project compose
# file publishes only MinIO on 59000/59001.
# API 8130 and web 3130 run on the host, not in this file.
# Do not add further `ports:` mappings. Never publish 3000 or 8000.
#
# Private inference is opt-in (`--profile private-inference`) and is not
# published on the host. Ordinary `up -d` does not start GPU/vLLM services.
#
# Host-run API processes cannot resolve Compose DNS names such as http://vllm:18000.
# Either run the API on the compose network, or publish vLLM on a host port that
# is not 3000 or 8000 and set PRIVATE_MODEL_BASE_URL to that published URL
# (default in config is http://127.0.0.1:18000/v1). Do not publish 3000 or 8000.

services:
  vllm:
    profiles: ["private-inference"]
    image: vllm/vllm-openai:latest
    command:
      - --model
      - private-generation-32b
      - --host
      - 0.0.0.0
      - --port
      - "18000"
    expose:
      - "18000"
    ipc: host
    restart: "no"
