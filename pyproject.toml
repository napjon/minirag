[project]
name = "marketdesk"
version = "0.1.0"
description = "Hypothetical marketplace operations desk with retrieval, analytics, catalog, detection, and reviewed drafting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pydantic>=2.10",
  "pgvector>=0.3",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.28",
  "openai>=1.60",
  "python-multipart>=0.0.18",
  "orjson>=3.10",
  "sse-starlette>=2.2",
  "structlog>=24.4",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "prometheus-client>=0.21",
  "redis>=5.2",
  "boto3>=1.35",
  "pypdf>=5.1",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-httpx>=0.34",
  "anyio>=4.6",
  "ruff>=0.8",
]
mcp = [
  "mcp>=1.2",
]
docling = [
  "docling>=2.12",
]

[project.scripts]
marketdesk = "backend.main:run"
marketdesk-worker = "backend.jobs.worker:run"
marketdesk-seed = "backend.seed:run"
marketdesk-mcp = "backend.integrations.mcp_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "evals"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"backend/api/router.py" = ["B008"]
"backend/auth/security.py" = ["B008"]
