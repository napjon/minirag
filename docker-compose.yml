# Local object storage for the fictional RAG platform.
# Postgres and Redis are provided by the shared devs/infra stack; this project
# must not start a second database or queue. Published host ports (do not add
# more; never 3000 or 8000): 59000 MinIO API, 59001 MinIO console.
# API 8130 and web 3130 run on the host (see README), not in this file.
# Private profile overlay: infra/compose.private.yml.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: marketdesk
      MINIO_ROOT_PASSWORD: marketdesk-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - marketdesk_minio:/data

volumes:
  marketdesk_minio:
